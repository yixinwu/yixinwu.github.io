<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>Yixin · 个人主页</title>
<style>
  :root {
    --bg: #0f1117;
    --card: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.09);
    --text: #e8eaf0;
    --muted: #9aa0b0;
    --accent: #7c8cff;
    --accent2: #4dd0b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    background:
      radial-gradient(600px 300px at 15% 0%, rgba(124,140,255,.14), transparent 60%),
      radial-gradient(500px 320px at 90% 20%, rgba(77,208,184,.10), transparent 60%),
      var(--bg);
    color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 20px 48px;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Tab 栏 ===== */
  .tabbar {
    display: flex; gap: 6px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 24px;
    position: sticky; top: 14px;
    z-index: 10;
    backdrop-filter: blur(12px);
  }
  .tabbar button {
    appearance: none; border: 0; cursor: pointer;
    font-size: 14px; font-family: inherit;
    padding: 8px 20px; border-radius: 999px;
    background: transparent; color: var(--muted);
    transition: background .18s ease, color .18s ease;
    white-space: nowrap;
  }
  .tabbar button.active {
    background: linear-gradient(135deg, var(--accent), #5a6cf0);
    color: #fff;
    box-shadow: 0 4px 16px rgba(124,140,255,.35);
  }

  /* ===== 主页 Tab ===== */
  .wrap { width: 100%; max-width: 620px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 32px;
    backdrop-filter: blur(10px);
    text-align: center;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 32px rgba(124,140,255,.35);
  }
  h1 { font-size: 28px; letter-spacing: 1px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
  .bio {
    color: var(--muted); font-size: 15px; line-height: 1.9;
    max-width: 440px; margin: 0 auto 28px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 32px; }
  .tag {
    font-size: 13px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text);
    background: rgba(255,255,255,.03);
  }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 10px 22px; border-radius: 12px;
    font-size: 14px; text-decoration: none; color: #fff;
    background: linear-gradient(135deg, var(--accent), #5a6cf0);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--text);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124,140,255,.3); }
  footer { margin-top: 28px; text-align: center; color: #5c6270; font-size: 12px; }

  /* ===== 报告 Tab ===== */
  #tab-report {
    width: 100%; max-width: 980px; flex: 1;
    display: none; flex-direction: column;
  }
  #tab-report iframe {
    width: 100%; flex: 1; min-height: calc(100vh - 140px);
    border: 1px solid var(--line); border-radius: 20px;
    background: #f8fafc;
  }
  .report-open {
    display: block; text-align: center;
    font-size: 13px; color: var(--muted); margin-top: 12px;
  }
  .report-open a { color: var(--accent); }
</style>
</head>
<body>

  <!-- Tab 栏 -->
  <nav class="tabbar" role="tablist">
    <button id="btn-home" class="active" role="tab" aria-selected="true">🏠 主页</button>
    <button id="btn-report" role="tab" aria-selected="false">📊 调研报告</button>
  </nav>

  <!-- Tab 1: 自我介绍 -->
  <div class="wrap" id="tab-home">
    <div class="card">
      <div class="avatar">Y</div>
      <h1>你好，我是 Yixin</h1>
      <div class="sub">终身学习者 · 技术爱好者</div>
      <p class="bio">
        欢迎来到我的个人主页。我喜欢探索新技术，
        享受把想法变成现实的过程。
        这里会记录我的学习、项目和一些思考。
      </p>
      <div class="tags">
        <span class="tag">📱 移动端</span>
        <span class="tag">☁️ 云计算</span>
        <span class="tag">🤖 AI 应用</span>
        <span class="tag">🏃 运动</span>
        <span class="tag">📚 阅读</span>
      </div>
      <div class="links">
        <a class="btn" href="mailto:wuyixin@huawei.com">✉️ 联系我</a>
        <a class="btn ghost" href="https://github.com/yixinwu" target="_blank">GitHub</a>
      </div>
    </div>
    <footer>© 2026 Yixin · Powered by GitHub Pages</footer>
  </div>

  <!-- Tab 2: 调研报告（内嵌加载 chipstack-report.html） -->
  <div id="tab-report">
    <iframe id="report-frame" src="about:blank" title="ChipStack AI Super Agent 完整调研报告"></iframe>
    <p class="report-open">加载慢？<a href="/chipstack-report.html" target="_blank">在新标签页打开完整报告 →</a></p>
  </div>

<script>
  (function () {
    var btnHome = document.getElementById('btn-home');
    var btnReport = document.getElementById('btn-report');
    var tabHome = document.getElementById('tab-home');
    var tabReport = document.getElementById('tab-report');
    var frame = document.getElementById('report-frame');
    var loaded = false;

    function activate(btn, other) {
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      other.classList.remove('active');
      other.setAttribute('aria-selected', 'false');
    }

    btnHome.addEventListener('click', function () {
      activate(btnHome, btnReport);
      tabHome.style.display = 'block';
      tabReport.style.display = 'none';
      document.title = 'Yixin · 个人主页';
    });

    btnReport.addEventListener('click', function () {
      activate(btnReport, btnHome);
      tabHome.style.display = 'none';
      tabReport.style.display = 'flex';
      if (!loaded) { frame.src = '/chipstack-report.html'; loaded = true; }
      document.title = '调研报告 · Yixin';
    });

    // 支持 /#/report 直达报告 Tab
    if (location.hash === '#/report') btnReport.click();
  })();
</script>

</body>
</html>
